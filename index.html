<style>
  html, body {
    margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, system-ui, sans-serif;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #game { display: block; background: #000; touch-action: none; outline: none; }

  /* ---------- touch controls ---------- */
  #touch { display: none; position: fixed; inset: 0; pointer-events: none; }
  body.touch #touch { display: block; }
  body.menu #touch { visibility: hidden; }
  .btn {
    position: absolute; pointer-events: auto; touch-action: none;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; letter-spacing: .04em; text-shadow: 0 1px 3px #000;
    border-radius: 50%; border: 3px solid rgba(255,255,255,.55);
    background: rgba(255,255,255,.14); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
  }
  .btn.down { background: rgba(255,255,255,.38); transform: scale(.95); }
  #btnFire {
    width: 24vmin; height: 24vmin; font-size: 3.6vmin;
    right: calc(4vmin + env(safe-area-inset-right)); bottom: calc(18vmin + env(safe-area-inset-bottom));
    background: rgba(230,50,40,.30); border-color: rgba(255,120,100,.8);
  }
  #btnFire.down { background: rgba(255,70,50,.6); }
  #btnWeapon {
    width: 13vmin; height: 13vmin; font-size: 2.4vmin;
    right: calc(30vmin + env(safe-area-inset-right)); bottom: calc(20vmin + env(safe-area-inset-bottom));
  }
  #btnPause {
    width: 9vmin; height: 9vmin; font-size: 3vmin;
    left: calc(2vmin + env(safe-area-inset-left)); top: calc(2vmin + env(safe-area-inset-top));
  }
  #joyBase, #joyKnob { position: absolute; border-radius: 50%; display: none; }
  #joyBase { width: 22vmin; height: 22vmin; border: 3px solid rgba(255,255,255,.4); background: rgba(255,255,255,.08); }
  #joyKnob { width: 10vmin; height: 10vmin; background: rgba(255,255,255,.4); border: 3px solid rgba(255,255,255,.7); }

  /* ---------- home menu ---------- */
  #home {
    position: fixed; inset: 0; z-index: 20; overflow-y: auto; overflow-x: hidden; touch-action: pan-y;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    padding: calc(4vmin + env(safe-area-inset-top)) calc(4vmin + env(safe-area-inset-right)) calc(6vmin + env(safe-area-inset-bottom)) calc(4vmin + env(safe-area-inset-left));
    box-sizing: border-box; color: #fff;
    background:
      radial-gradient(1.5px 1.5px at 12% 18%, #fff, transparent), radial-gradient(1px 1px at 28% 72%, #cde, transparent),
      radial-gradient(1.5px 1.5px at 47% 33%, #fff, transparent), radial-gradient(1px 1px at 63% 81%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 78% 22%, #cde, transparent), radial-gradient(1px 1px at 91% 58%, #fff, transparent),
      radial-gradient(1px 1px at 6% 90%, #fff, transparent), radial-gradient(1px 1px at 55% 8%, #cde, transparent),
      radial-gradient(ellipse at 50% 0%, #1b2a5e 0%, #0a1030 45%, #04060f 100%);
  }
  body.home #home { display: flex; }
  body.home #wrap, body.home #touch, body.home #btnHome { display: none; }
  #home h1 {
    margin: 0; display: flex; align-items: center; gap: 2.2vmin;
    font-size: clamp(30px, 8vmin, 84px); font-weight: 900; letter-spacing: .08em; text-transform: uppercase; text-align: center;
    background: linear-gradient(180deg, #fff 20%, #8fd0ff 60%, #5b7cff 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px rgba(110,160,255,.45));
  }
  #home h1 svg { width: clamp(34px, 9vmin, 92px); height: auto; flex: none; }
  #home .sub { margin: 1.2vmin 0 5vmin; color: #9db4e8; letter-spacing: .3em; font-size: clamp(11px, 2vmin, 18px); text-transform: uppercase; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(clamp(150px, 22vmin, 240px), 1fr)); gap: 2.4vmin; width: min(100%, 1100px); }
  .card {
    position: relative; display: flex; flex-direction: column; justify-content: flex-end; gap: .6vmin; text-align: left;
    aspect-ratio: 4 / 3.2; padding: 2vmin; border-radius: 14px; border: 2px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.05); color: #fff; font: inherit; overflow: hidden; box-sizing: border-box;
  }
  .card .thumb { position: absolute; inset: 0 0 38% 0; display: flex; align-items: center; justify-content: center; font-size: 7vmin; color: rgba(255,255,255,.18); font-weight: 800; }
  .card .name { position: relative; font-size: clamp(14px, 2.7vmin, 24px); font-weight: 800; letter-spacing: .04em; }
  .card .desc { position: relative; font-size: clamp(10px, 1.7vmin, 14px); color: #b8c6ea; }
  .card .tag { position: absolute; top: 1.4vmin; right: 1.4vmin; font-size: clamp(9px, 1.5vmin, 12px); font-weight: 800; letter-spacing: .12em; padding: .5vmin 1.2vmin; border-radius: 99px; background: rgba(255,255,255,.1); color: #aab; }
  .card.soon { border-style: dashed; opacity: .6; cursor: default; }
  .card.play {
    cursor: pointer; border-color: #ff6a3c; background: linear-gradient(160deg, rgba(255,90,50,.30), rgba(120,20,20,.35) 60%, rgba(10,10,30,.5));
    box-shadow: 0 0 28px rgba(255,90,50,.25); transition: transform .15s, box-shadow .15s; -webkit-appearance: none; appearance: none;
  }
  .card.play .thumb { color: #fff; }
  .card.play .tag { background: #ff6a3c; color: #fff; }
  .card.play:hover, .card.play:focus-visible { transform: translateY(-4px) scale(1.02); box-shadow: 0 0 40px rgba(255,90,50,.5); outline: none; }
  .card.play:active { transform: scale(.98); }
  #ver { position: fixed; right: calc(12px + env(safe-area-inset-right)); bottom: calc(8px + env(safe-area-inset-bottom)); font-size: 11px; color: rgba(255,255,255,.55); letter-spacing: .05em; z-index: 30; pointer-events: none; }
  body:not(.home) #ver { display: none; }

  /* back-to-menu button shown on the in-game title / pause / death screens */
  #btnHome {
    display: none; position: fixed; z-index: 15; left: calc(2vmin + env(safe-area-inset-left)); top: calc(2vmin + env(safe-area-inset-top));
    padding: 1.2vmin 2.4vmin; font: 800 clamp(12px, 2.2vmin, 18px) -apple-system, system-ui, sans-serif; letter-spacing: .08em; color: #fff;
    border: 2px solid rgba(255,255,255,.55); border-radius: 99px; background: rgba(0,0,0,.55); touch-action: manipulation;
  }
  body.menu:not(.home) #btnHome { display: block; }
</style>

<script>
/* =====================================================================
 *  COMETBOUND GAMES v0.9.1  -  home menu + RAYCAST ARENA (first-person shooter), one HTML file.
 *
 *  Desktop : WASD move, mouse look (click to capture), click/Space fire,
 *            1/2/3/Q/wheel weapons, Shift run, [ ] sensitivity, I invert Y,
 *            F fps, M mute, Esc pause.
 *  iPad    : left thumb = floating joystick (push to the edge to run),
 *            right thumb drag = look, FIRE button, SWAP button, II = pause.
 * ===================================================================== */
'use strict';

// ------------------------------------------------------------------ config
const W = 640, H = 400, TEX = 64;
const PLANE = 0.75, PITCH_MAX = 170;
const MAP = [
  "111111111111111111111111",
  "1......1...........H...1",
  "1......1.............S.1",
  "1..22..1...3333....22..1",
  "1..2.......3..3....2...1",
  "1..2...1...............1",
  "1......1.......4.......1",
  "111.11111111.11111111.11",
  "1......................1",
  "1......................1",
  "1..33...........44...H.1",
  "1..3............4......1",
  "1..3....P..............1",
  "1......................1",
  "1.A..................S.1",
  "111.11111111.1111111.111",
  "1.....1.........1......1",
  "1.....1....22...1..A...1",
  "1.....1..........1.....1",
  "1.....3..........3.....1",
  "1..................2...1",
  "1.......3333333........1",
  "1......................1",
  "111111111111111111111111",
];
const MW = 24, MH = MAP.length;
const grid = Array.from({ length: MH }, () => new Array(MW).fill(0));

// ------------------------------------------------------------------ canvases
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const frameCv = document.createElement('canvas');
frameCv.width = W; frameCv.height = H;
const fctx = frameCv.getContext('2d');
const frameBuf = new ArrayBuffer(W * H * 4);
const px = new Uint32Array(frameBuf);
const img = new ImageData(new Uint8ClampedArray(frameBuf), W, H);
const zBuf = new Float64Array(W);

// ------------------------------------------------------------------ textures
function mulberry(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// pixels are stored as ABGR (little-endian RGBA) so they can go straight into ImageData
function rgb(r, g, b) {
  r = r < 0 ? 0 : r > 255 ? 255 : r | 0; g = g < 0 ? 0 : g > 255 ? 255 : g | 0; b = b < 0 ? 0 : b > 255 ? 255 : b | 0;
  return (255 << 24) | (b << 16) | (g << 8) | r;
}
function hash(a, b) {
  let h = Math.imul(a, 73856093) ^ Math.imul(b, 19349663);
  h ^= h >>> 13; h = Math.imul(h, 0x5bd1e995); h ^= h >>> 15;
  return h & 0x7fffffff;
}
function shade(c, l) {
  const r = (c & 255) * l >> 8, g = ((c >> 8) & 255) * l >> 8, b = ((c >> 16) & 255) * l >> 8;
  return (255 << 24) | (b << 16) | (g << 8) | r;
}
function light(d) { return Math.max((256 / (1 + d * d * 0.035)) | 0, 14); }

const rnd = Math.random;
function mk(fn) { const t = new Uint32Array(TEX * TEX); for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) t[y * TEX + x] = fn(x, y); return t; }

function brick(r) {
  const ri = n => Math.floor(r() * n);
  return mk((x, y) => {
    const row = y >> 4, off = (row & 1) * 16, bx = (x + off) % 32, n = ri(20) - 10;
    if ((y % 16) < 2 || bx < 2) return rgb(95 + n, 92 + n, 86 + n);
    const v = hash(row, ((x + off) % 64) >> 5) % 36;
    return rgb(140 + v + n, 56 + (v >> 1) + n, 42 + n);
  });
}
function stone(r) {
  const ri = n => Math.floor(r() * n);
  return mk((x, y) => {
    const bx = x % 32, by = y % 21, blk = hash(x >> 5, (y / 21) | 0) % 24, n = ri(16) - 8;
    let base = 118 + blk + n;
    if (bx === 0 || by === 0) base -= 55; else if (bx === 1 || by === 1) base += 18;
    return rgb(base, base - 3, base - 8);
  });
}
function metal(r) {
  const ri = n => Math.floor(r() * n);
  const rowN = []; for (let i = 0; i < TEX; i++) rowN.push(ri(12) - 6);
  return mk((x, y) => {
    const n = rowN[y] + ri(6);
    let rr = 62 + n, gg = 78 + n, bb = 104 + n;
    const qx = x % 32, qy = y % 32;
    if (qx < 2 || qy < 2) { rr -= 30; gg -= 30; bb -= 30; }
    else if (qx === 2 || qy === 2) { rr += 20; gg += 20; bb += 20; }
    let dx = qx - 6, dy = qy - 6;
    if (dx * dx + dy * dy < 7) { rr += 55; gg += 55; bb += 55; }
    dx = qx - 26;
    if (dx * dx + dy * dy < 7) { rr += 55; gg += 55; bb += 55; }
    return rgb(rr, gg, bb);
  });
}
function tech(r) {
  const ri = n => Math.floor(r() * n);
  return mk((x, y) => {
    const n = ri(8);
    let rr = 20 + n, gg = 26 + n, bb = 32 + n;
    if (x % 16 === 0 || y % 16 === 0) { rr += 12; gg += 18; bb += 22; }
    const h = hash(x >> 3, y >> 3) % 9;
    if (h === 0 && (x % 8) > 1 && (y % 8) > 1) { gg += 120; bb += 80; }
    if (h === 1 && (y % 8) === 3) { rr += 150; gg += 40; }
    if (x >= 20 && x < 44 && y >= 20 && y < 44) {
      const d = Math.abs(x - 32) + Math.abs(y - 32);
      rr = 0; gg = 210 - d * 5; bb = 170 - d * 4;
      if (x === 20 || x === 43 || y === 20 || y === 43) { gg = 255; bb = 255; rr = 120; }
    }
    return rgb(rr, gg, bb);
  });
}
function floorTile(r, base, edge) {
  return mk((x, y) => {
    const n = Math.floor(r() * 14) - 7;
    let v = base + n;
    if (x === 0 || y === 0) v = edge; else if (x === 1 || y === 1) v += 12;
    return rgb(v, v - 4, v - 10);
  });
}
function ceilTile(r) {
  return mk((x, y) => {
    const n = Math.floor(r() * 8) - 4;
    let v = 52 + n;
    if (x % 32 < 2 || y % 32 < 2) v = 28;
    const cx = x % 32 - 16, cy = y % 32 - 16;
    if (cx * cx + cy * cy < 18) return rgb(250, 240, 200);
    return rgb(v, v + 2, v + 8);
  });
}

// ------------------------------------------------------------------ sprites (drawn with canvas 2D)
function sprite(fn) {
  const c = document.createElement('canvas'); c.width = c.height = TEX;
  const g = c.getContext('2d', { willReadFrequently: true });
  fn(g);
  return new Uint32Array(g.getImageData(0, 0, TEX, TEX).data.buffer.slice(0));
}
function rr(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  g.lineTo(x + r, y + h + 0); g.quadraticCurveTo(x, y + h, x, y + h - r);
  g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath(); g.fill();
}
function oval(g, x, y, w, h) { g.beginPath(); g.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, Math.PI * 2); g.fill(); }
function pg(g, pts) { g.beginPath(); g.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]); g.closePath(); g.fill(); }

function demon(body, dark, skin, attack) {
  return sprite(g => {
    g.fillStyle = dark; rr(g, 20, 44, 11, 20, 5); rr(g, 34, 44, 11, 20, 5);
    g.fillStyle = body; rr(g, 14, 20, 36, 31, 14);
    if (attack) {
      rr(g, 3, 6, 10, 28, 7); rr(g, 51, 6, 10, 28, 7);
      g.fillStyle = '#ff8c1e'; oval(g, 1, 1, 12, 12); oval(g, 51, 1, 12, 12);
    } else { rr(g, 4, 22, 10, 28, 7); rr(g, 50, 22, 10, 28, 7); }
    g.strokeStyle = dark; g.lineWidth = 1;
    g.beginPath(); g.moveTo(32, 26); g.lineTo(32, 46); g.stroke();
    g.beginPath(); g.ellipse(32, 34, 12, 6, 0, Math.PI, Math.PI * 2); g.stroke();
    g.fillStyle = skin; oval(g, 19, 2, 26, 24);
    g.fillStyle = '#ebe1c3';
    pg(g, [20, 9, 14, -1, 27, 5]); pg(g, [44, 9, 50, -1, 37, 5]);
    g.fillStyle = '#fff028'; oval(g, 24, 10, 6, 5); oval(g, 34, 10, 6, 5);
    g.fillStyle = '#000'; g.fillRect(26, 11, 2, 3); g.fillRect(36, 11, 2, 3);
    if (attack) { g.fillStyle = '#ff640a'; oval(g, 26, 16, 12, 8); }
    else { g.fillStyle = '#000'; g.fillRect(26, 18, 12, 2); }
  });
}
function corpse(body, skin) {
  return sprite(g => {
    g.fillStyle = 'rgba(120,10,10,.86)'; oval(g, 4, 50, 56, 13);
    g.fillStyle = body; rr(g, 10, 46, 38, 14, 6);
    g.fillStyle = skin; oval(g, 42, 44, 16, 15);
    g.fillStyle = '#ebe1c3'; pg(g, [48, 46, 52, 38, 55, 46]);
    g.fillStyle = body; rr(g, 2, 52, 14, 7, 3);
  });
}
function radial(stops, r) {
  return sprite(g => {
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, r);
    for (const [o, c] of stops) gr.addColorStop(o, c);
    g.fillStyle = gr; g.fillRect(0, 0, TEX, TEX);
  });
}

const WALL = [null, brick(mulberry(11)), stone(mulberry(12)), metal(mulberry(13)), tech(mulberry(14))];
const FLOOR_A = floorTile(mulberry(15), 78, 40), FLOOR_B = floorTile(mulberry(16), 62, 34), CEIL = ceilTile(mulberry(17));

const SPR_E = [
  [demon('#aa281e', '#641414', '#cd553c', false), demon('#aa281e', '#641414', '#cd553c', true), corpse('#aa281e', '#cd553c')],
  [demon('#6e2896', '#3c145a', '#965aaa', false), demon('#6e2896', '#3c145a', '#965aaa', true), corpse('#6e2896', '#965aaa')],
  [demon('#28784a', '#143c28', '#6eaa50', false), demon('#28784a', '#143c28', '#6eaa50', true), corpse('#28784a', '#6eaa50')],
];
const SPR_HEALTH = sprite(g => {
  g.fillStyle = '#ebebeb'; rr(g, 6, 12, 52, 44, 8);
  g.strokeStyle = '#969696'; g.lineWidth = 1; g.strokeRect(6.5, 12.5, 51, 43);
  g.fillStyle = '#d21414'; g.fillRect(27, 18, 10, 32); g.fillRect(16, 29, 32, 10);
});
const SPR_AMMO = sprite(g => {
  g.fillStyle = '#5a6432'; rr(g, 6, 22, 52, 36, 6);
  for (let i = 0; i < 5; i++) {
    g.fillStyle = '#e6be3c'; rr(g, 12 + i * 9, 10, 6, 20, 3);
    g.fillStyle = '#be8228'; g.fillRect(12 + i * 9, 24, 6, 5);
  }
  g.fillStyle = 'rgba(255,255,255,.8)'; g.fillRect(14, 38, 36, 4);
});
const SPR_ARMOR = sprite(g => {
  g.fillStyle = '#285ac8'; pg(g, [32, 8, 56, 16, 52, 40, 32, 58, 12, 40, 8, 16]);
  g.fillStyle = '#96c8ff'; pg(g, [32, 14, 48, 20, 45, 38, 32, 50]);
  g.strokeStyle = '#14286e'; g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(32, 8); g.lineTo(56, 16); g.lineTo(52, 40); g.lineTo(32, 58); g.lineTo(12, 40); g.lineTo(8, 16); g.closePath(); g.stroke();
});
const SPR_FIREBALL = radial([[0, 'rgb(255,255,220)'], [.35, 'rgb(255,200,40)'], [.7, 'rgb(255,80,0)'], [1, 'rgba(180,20,0,0)']], 30);
const SPR_ROCKET = radial([[0, '#fff'], [.3, 'rgb(255,240,150)'], [.6, 'rgb(255,150,40)'], [1, 'rgba(200,60,0,0)']], 30);
const SPR_EXPLOSION = radial([[0, 'rgb(255,255,230)'], [.25, 'rgb(255,210,80)'], [.55, 'rgb(255,100,20)'], [.85, 'rgba(160,30,0,.78)'], [1, 'rgba(80,10,0,0)']], 31);

// ------------------------------------------------------------------ sound (WebAudio, synthesised)
const S = { PISTOL: 0, SHOTGUN: 1, HURT: 2, DIE: 3, PICKUP: 4, FIRE: 5, EMPTY: 6, WAVE: 7, ROCKET: 8, BOOM: 9 };
let actx = null, sndBuffers = [], soundOn = true;
function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();

    let wx = side === 0 ? posY + t * rdy : posX + t * rdx;
    wx -= Math.floor(wx);
    let tx = (wx * TEX) | 0;
    if ((side === 0 && rdx > 0) || (side === 1 && rdy < 0)) tx = TEX - 1 - tx;
    let l = light(t); if (side === 1) l = l * 3 >> 2;
    const step = TEX / lineH, y0 = Math.max(0, start), y1 = Math.min(H - 1, end);
    let tp = (y0 - start) * step;
    for (let y = y0; y <= y1; y++) {
      let ty = tp | 0; if (ty > 63) ty = 63; tp += step;
      px[y * W + x] = shade(tex[ty * TEX + tx], l);

}

function renderSprites(half) {
  const vis = ents.slice().sort((a, b) =>
    ((b.x - posX) ** 2 + (b.y - posY) ** 2) - ((a.x - posX) ** 2 + (a.y - posY) ** 2));
  const inv = 1 / (planeX * dirY - dirX * planeY);
  for (const e of vis) {
    const sx = e.x - posX, sy = e.y - posY;
    const tx = inv * (dirY * sx - dirX * sy), ty = inv * (-planeY * sx + planeX * sy);
    if (ty < .15) continue;
    let spr, scale = 1, floating = false, fullbright = false, additive = false;
    switch (e.type) {
      case T_ENEMY: spr = SPR_E[e.kind][e.dead ? 2 : e.windup > 0 ? 1 : 0]; scale = e.kind === 0 ? .95 : e.kind === 1 ? 1.05 : 1.5; break;
      case T_HEALTH: spr = SPR_HEALTH; scale = .35; break;
      case T_AMMO: spr = SPR_AMMO; scale = .35; break;
      case T_ARMOR: spr = SPR_ARMOR; scale = .4; break;
      case T_ROCKET: spr = SPR_ROCKET; scale = .28; floating = fullbright = true; break;
      case T_EXPLOSION: spr = SPR_EXPLOSION; floating = fullbright = additive = true; scale = .6 + 1.6 * (1 - e.life / .45); break;
      default: spr = SPR_FIREBALL; scale = .32; floating = fullbright = true;
    }
    const screenX = (W / 2 * (1 + tx / ty)) | 0;
    const sprH = Math.abs((H / ty * scale) | 0), sprW = sprH;
    if (sprH < 1) continue;
    const vMove = floating ? 0 : (((1 - scale) / 2 * (H / ty)) | 0);
    const top = (-sprH / 2 + half + vMove) | 0, left = (-sprW / 2 + screenX) | 0;
    const l = additive ? (256 * Math.max(0, e.life) / .45) | 0 : fullbright ? 256 : light(ty);
    const boost = (e.type === T_ENEMY && e.pain > 0 && !e.dead) ? 90 : 0;
    const xs = Math.max(0, left), xe = Math.min(W - 1, left + sprW - 1);
    const ys = Math.max(0, top), ye = Math.min(H - 1, top + sprH - 1);
    for (let x = xs; x <= xe; x++) {
      if (ty >= zBuf[x]) continue;
      let sxT = ((x - left) * TEX / sprW) | 0; if (sxT > 63) sxT = 63;
      for (let y = ys; y <= ye; y++) {
        let syT = ((y - top) * TEX / sprH) | 0; if (syT > 63) syT = 63;
        const c = spr[syT * TEX + sxT], al = c >>> 24;
        if (al < (additive ? 8 : 128)) continue;
        let col = shade(c, additive ? l * al >> 8 : l);
        if (additive) {
          const o = px[y * W + x];
          px[y * W + x] = (255 << 24) | (Math.min(255, ((o >> 16) & 255) + ((col >> 16) & 255)) << 16) |
            (Math.min(255, ((o >> 8) & 255) + ((col >> 8) & 255)) << 8) | Math.min(255, (o & 255) + (col & 255));
          continue;
        }
        if (boost) {
          col = (255 << 24) | (Math.min(255, ((col >> 16) & 255) + boost) << 16) |
            (Math.min(255, ((col >> 8) & 255) + boost) << 8) | Math.min(255, (col & 255) + boost);
        }
        px[y * W + x] = col;
      }
    }
  }
}

// ------------------------------------------------------------------ weapon / HUD
function box(cx, by, u, color, x, y, w, h) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.floor(cx + x * u), Math.floor(by + y * u), Math.ceil(w * u), Math.ceil(h * u));
}
function poly(cx, by, u, color, ...p) {
  ctx.fillStyle = color; ctx.beginPath();
  for (let i = 0; i < p.length; i += 2) { const X = cx + p[i] * u, Y = by + p[i + 1] * u; i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }
  ctx.closePath(); ctx.fill();
}
function drawGun(pw, ph) {

    box(cx, by, u, '#828690', -24, -270, 48, 8);

    box(cx, by, u, '#404248', -16, -340, 32, 250);
    box(cx, by, u, '#64686f', -16, -340, 6, 250);
    box(cx, by, u, '#282a2e', -26, -170, 52, 74);
    box(cx, by, u, '#78502c', -24, -260, 48, 80);
    box(cx, by, u, skin, -36, -236, 72, 34);
    box(cx, by, u, skinD, -36, -210, 72, 6);
    box(cx, by, u, '#141416', -8, -346, 16, 10);
  } else {
    poly(cx, by, u, sleeve, -110, 0, -85, -60, 95, -60, 120, 0);
    box(cx, by, u, '#4a5c3c', -40, -350, 80, 300);
    box(cx, by, u, '#748a62', -40, -350, 10, 300);
    box(cx, by, u, '#34402a', -40, -350, 80, 14);
    box(cx, by, u, '#34402a', -40, -200, 80, 10);
    box(cx, by, u, '#1e1e20', -46, -366, 92, 20);
    box(cx, by, u, '#141416', -30, -362, 60, 8);
    box(cx, by, u, '#28282c', -12, -120, 24, 70);
    box(cx, by, u, skin, -46, -176, 92, 40);

  }

    const fy = weapon === 0 ? 296 : weapon === 1 ? 350 : 366, r = (weapon === 0 ? 70 : weapon === 1 ? 120 : 130) * u;
    const X = cx, Y = by - fy * u, g = ctx.createRadialGradient(X, Y, 0, X, Y, r);

function drawHud(pw, ph) {

// ------------------------------------------------------------------ layout
function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const aw = Math.min(vw, vh * 1.6), ah = aw / 1.6;
  cvs.style.width = aw + 'px'; cvs.style.height = ah + 'px';
  let dpr = Math.min(window.devicePixelRatio || 1, 2);

// ------------------------------------------------------------------ input: keyboard / mouse

}
function goHome() {

  ptrs.clear(); joyBase.style.display = joyKnob.style.display = 'none'; btnFire.classList.remove('down');

    const el = document.documentElement, rf = el.requestFullscreen || el.webkitRequestFullscreen;

    placeJoy(p.ox, p.oy, p.ox + vx, p.oy + vy);
    let jx = vx / R, jy = -vy / R; const jm = Math.hypot(jx, jy);
    if (jm < .15) { jx = jy = 0; }
    joyX = jx; joyY = jy;
  } else if (state === ST_PLAY && !paused) lookDelta(dx, dy);
  e.preventDefault();
}, { passive: false });
function pointerEnd(e) {
  const p = ptrs.get(e.pointerId); if (!p) return;
  ptrs.delete(e.pointerId);
  if (p.kind === 'joy') { joyX = joyY = 0; joyBase.style.display = joyKnob.style.display = 'none'; }
  if (p.kind === 'fire') { touchFire = false; btnFire.classList.remove('down'); }
}
window.addEventListener('pointerup', e => { if (e.pointerType === 'mouse') { if (e.button === 0) mouseDown = false; return; } pointerEnd(e); });
window.addEventListener('pointercancel', e => { if (e.pointerType !== 'mouse') pointerEnd(e); });

// stop iOS from scrolling / zooming / selecting
document.addEventListener('touchmove', e => { if (!e.target.closest || !e.target.closest('#home')) e.preventDefault(); }, { passive: false });
document.addEventListener('touchstart', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault()));
let lastTap = 0;
document.addEventListener('touchend', e => { const n = Date.now(); if (n - lastTap < 300) e.preventDefault(); lastTap = n; }, { passive: false });

// ------------------------------------------------------------------ main loop
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - lastT) / 1000);
  lastT = now;
  if (!inHome) {
    if (dt > 0) fps += (1 / dt - fps) * .05;
    update(dt);
    paint();
  }
  requestAnimationFrame(frame);
}
document.getElementById('cardRay').addEventListener('click', showGame);
const btnHomeEl = document.getElementById('btnHome');
btnHomeEl.addEventListener('pointerdown', e => e.stopPropagation());
btnHomeEl.addEventListener('click', e => { e.stopPropagation(); goHome(); });
reset();
syncBody();
document.getElementById('cardRay').focus();
requestAnimationFrame(frame);
</script>
</body>
